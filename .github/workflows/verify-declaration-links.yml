name: Verify declaration links

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-declaration-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Use Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@v8

      - name: Build site
        run: nix shell nixpkgs#just --command just build-site

      - name: Verify declaration links
        run: nix shell nixpkgs#just nixpkgs#jq --command just verify-declaration-links
