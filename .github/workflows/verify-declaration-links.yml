name: Verify declaration links

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-declaration-links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v16

      - name: Build site without substitutes
        run: nix build --no-substitute .#svelte-frontend-with-data-pages

      - name: Verify declaration links
        run: nix shell nixpkgs#just nixpkgs#jq --command just verify-declaration-links
